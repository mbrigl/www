# The deploy workflow overrides baseURL with the GitHub Pages URL. The custom domain is set in the
# repository's Pages settings; a CNAME file has no effect with Actions-based deployment.
baseURL = "https://brigl.info/"
locale = "en"
title = "Markus Brigl"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  tagline = "Software Architect"
  description = "Markus Brigl, software architect and fullstack developer in model-driven and spec-driven development. Selected open-source projects and career."
  linkedin = "https://www.linkedin.com/in/markus-brigl-b1094195/"
  github = "https://github.com/mbrigl"
  hivevm = "https://github.com/hivevm"
  # Optional. Leave empty to hide the "Email me" button.
  email = ""

[[menus.main]]
  name = "Vision"
  url = "/#vision"
  weight = 10

[[menus.main]]
  name = "Projects"
  url = "/#projects"
  weight = 20

[[menus.main]]
  name = "Career"
  url = "/#career"
  weight = 30

[markup.goldmark.renderer]
  unsafe = false

# Code blocks get CSS classes instead of inline colours, so they follow the theme switch.
# The colours live in assets/css/chroma.css, generated by scripts/chroma-css.sh.
[markup.highlight]
  noClasses = false

[minify]
  minifyOutput = true
