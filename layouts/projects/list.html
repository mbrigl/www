{{ define "main" }}
<div class="wrap page">
  <p class="crumb"><a href="{{ "/" | relURL }}">← Home</a></p>
  <h1 class="page__title">{{ .Title }}</h1>
  <p class="muted prose-narrow">{{ hugo.Data.home.projects.text }}</p>
  <div class="cards">
    {{ range .Pages.ByWeight }}{{ partial "project-card.html" . }}{{ end }}
  </div>
</div>
{{ end }}
