<article class="card featured">
  <div class="featured__text">
    <p class="mono accent small">{{ .meta }}</p>
    <h3>{{ .role }}</h3>
    <p class="muted small featured__task">{{ .title }}</p>
    <p class="muted">{{ .text }}</p>
  </div>
  <dl class="stack">
    {{ range .stack }}<div><dt>{{ .key }}</dt><dd>{{ .value }}</dd></div>{{ end }}
  </dl>
</article>
