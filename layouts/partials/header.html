<header class="site-header">
  <div class="wrap site-header__bar">
    <a class="brand" href="{{ "/" | relURL }}"><span class="logo" aria-hidden="true">MB</span>{{ site.Title }}</a>
    {{ partial "theme-switch.html" . }}
    <nav class="nav" aria-label="Sections">
      {{ range site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}
      <a class="btn btn--small" href="{{ "/#contact" | relURL }}">Contact</a>
    </nav>
  </div>
</header>
