vision:
  heading: "Models and specs outlive the stack"
  statement: "Software should be described by what it means, not by the technology it happens to run on."
  text: "Since 2003 I have worked on one idea: describe the system first, then let tools produce the technology. From UML-based ERP frameworks and an Eclipse code generator to a low-code platform on hexagonal architecture, the stack changed many times. Today, with AI in the loop, the written specification takes the same role: specs and architecture decisions define the intent, and coding agents build against them. What stays is the description of intent."

# Vision graphic: one description of intent on top, the stacks it was built with below.
# hue (here and in stats): saffron, rust, plum, olive, brick or rose; the rail runs through the era hues
