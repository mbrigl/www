principles:
  - { n: "01", title: "Start from the model",       text: "Describe what a system means, independent of any platform. Technologies change, the model stays." }
  - { n: "02", title: "Write the spec first",       text: "Specifications and architecture decision records define intent before code. People decide, agents implement, and the spec is the contract between them." }
  - { n: "03", title: "Keep the core independent",  text: "Hexagonal architecture keeps business logic free of frameworks, so the stack can evolve without disrupting it." }
  - { n: "04", title: "Generate, don't repeat",     text: "Generators, templates and coding agents turn models and specs into running code, so effort goes into decisions instead of boilerplate." }

